<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do Anúncio — Vitrine Digital</title>
  <meta name="description" content="Confira o catálogo de produtos e entre em contato direto pelo WhatsApp oficial." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A88C5A' stroke-width='2'><polygon points='12 2 2 7 12 12 22 7 12 2'></polygon><polyline points='2 17 12 22 22 17'></polyline><polyline points='2 12 12 17 22 12'></polyline></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- CABEÇALHO / NAVBAR -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand-logo">
        <div class="logo-capsule">❖</div>
        <div class="brand-info">
          <div class="brand-title-wrap">
            <span class="brand-title">Vitrine Digital</span>
            <span class="badge-tag">Editorial</span>
          </div>
          <span class="brand-subtitle">Catálogo de Ofertas & Comércios</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="index.html" class="btn btn-outline">
          <span>← Voltar à Vitrine</span>
        </a>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL DO ANÚNCIO -->
  <main class="ad-detail-page">
    <div class="container">
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Voltar para todas as lojas e produtos</span>
      </a>

      <div id="ad-content">
        <!-- Renderizado dinamicamente pelo anuncio.js -->
        <div class="empty-state">
          <h3>Carregando detalhes do anúncio...</h3>
        </div>
      </div>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Vitrine Digital — Inspirado na identidade visual do <a href="https://pycriador.github.io/site-olivelas/" target="_blank" rel="noopener noreferrer">Site Olivelas</a>.</p>
      <p style="margin-top: 0.35rem; font-size: 0.72rem; color: var(--color-faint);">
        Hospedado estaticamente no GitHub Pages. Dados fornecidos via JSON.
      </p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/anuncio.js"></script>
</body>
</html>
