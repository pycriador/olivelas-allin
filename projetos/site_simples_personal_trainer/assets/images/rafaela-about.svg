<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123d33"/>
      <stop offset="50%" stop-color="#1c5447"/>
      <stop offset="100%" stop-color="#0a2a22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d5a3"/>
      <stop offset="100%" stop-color="#c99846"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#aboutGrad)"/>

  <circle cx="400" cy="380" r="280" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="400" cy="380" r="220" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="6 6"/>

  <g transform="translate(400, 370)">
    <circle cx="0" cy="0" r="100" fill="#246153" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="-25" r="38" fill="#e8edea"/>
    <path d="M-58 60 C-58 15, -40 15, 0 15 C40 15, 58 15, 58 60 Z" fill="#e8edea"/>
  </g>

  <rect x="130" y="660" width="540" height="210" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="url(#gold)" stroke-width="1.5"/>

  <text x="400" y="715" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="2">SOBRE A RAFAELA</text>
  <text x="400" y="750" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="500" fill="#c99846">Foto em Atendimento / Perfil Profissional</text>
  <text x="400" y="790" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" fill="#a4b8b3">Arquivo de destino: /assets/images/rafaela-about.jpg</text>
  <text x="400" y="825" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" fill="#809993">Dimensão recomendada: 1200 x 1500 px</text>
</svg>
