<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#052e16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#logoBg)" filter="url(#dropShadow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#86efac" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Sun Glow -->
  <circle cx="256" cy="180" r="75" fill="url(#sunGrad)" opacity="0.9"/>

  <!-- Stylized Leaves & Produce -->
  <!-- Left Leaf -->
  <path d="M 256 160 C 200 120, 160 180, 170 240 C 200 240, 240 210, 256 160 Z" fill="url(#leafGrad)"/>
  <!-- Right Leaf -->
  <path d="M 256 160 C 312 120, 352 180, 342 240 C 312 240, 272 210, 256 160 Z" fill="#86efac"/>
  <!-- Central Sprout Stem -->
  <path d="M 256 250 Q 256 170, 256 150" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Fresh Produce Silhouette Overlay (Apple / Orange / Tomato / Leaves) -->
  <path d="M 220 260 C 190 260, 175 285, 175 310 C 175 345, 205 370, 256 370 C 307 370, 337 345, 337 310 C 337 285, 322 260, 292 260 C 275 260, 264 270, 256 270 C 248 270, 237 260, 220 260 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="230" cy="305" r="8" fill="#16a34a"/>
  <circle cx="282" cy="305" r="8" fill="#16a34a"/>
  <path d="M 240 330 Q 256 345, 272 330" stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Ribbon for Typography -->
  <path d="M 70 410 L 442 410 L 412 470 L 100 470 Z" fill="#0f172a" opacity="0.9"/>
  
  <!-- Text HORTIFRUTI -->
  <text x="256" y="442" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#facc15" text-anchor="middle" letter-spacing="3">HORTIFRUTI</text>
  <text x="256" y="462" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="4">HORTIFRUTI</text>
</svg>