name: Documentation Validation

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docs-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Documentation Lint
        run: python3 scripts/docs_lint.py lint

      - name: Documentation Report
        if: always()
        run: python3 scripts/docs_lint.py report

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-health
          path: |
            docs/en/reports/documentation-health.md
            docs/en/generated/manifest-index.md
          if-no-files-found: warn
