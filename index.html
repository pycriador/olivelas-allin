<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedScheme = localStorage.getItem('color-scheme') || 'light dark';
        var savedPreset = localStorage.getItem('olivelas-theme-preset') || '';
        document.querySelector('meta[name="color-scheme"]').content = savedScheme;
        if (savedPreset) {
          document.documentElement.setAttribute('data-theme', savedPreset);
        }
      } catch (e) {}
    </script>
    <title>Olivelas Allin v0.0.1 — Plataforma SaaS Multiempresa Modular</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
